{% set name = "oommfc" %}
{% set version = "0.66.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 55772b9cb609bd54a2aeef3aa4620e64450a8546959c18755f764d8eb96ba644

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - oommf ==2.0b0.post1
    - micromagneticmodel >=0.65.0
    - micromagnetictests >=0.64.0
    - ubermagtable >=0.62.0
    - ubermagutil >=0.64.0
    - micromagneticdata >=0.66.0

test:
  requires:
    - python {{ python_min }}
  imports:
    - oommfc
  commands:
    - python -c "import sys; import oommfc; sys.exit(oommfc.test())"

about:
  home: http://ubermag.github.io/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: OOMMF calculator.
  doc_url: https://ubermag.github.io/documentation/oommfc.html
  dev_url: https://github.com/ubermag/oommfc

extra:
  recipe-maintainers:
    - marijanbeg
    - takluyver
    - fangohr
    - lang-m
    - samjrholt
    - swapneelap
